<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>SSH Key Maker</title>
<style>
  /* Кольори іконки: темно-синій фон і градієнт блакитний → синій → фіолетовий → пурпуровий */
  :root {
    --bg: #080b17; --panel: rgba(18, 23, 44, .72); --field: #0c1124; --text: #eef0ff; --muted: #8b90b5;
    --border: rgba(122, 112, 255, .22); --border-strong: rgba(122, 112, 255, .45);
    --cyan: #38bdf8; --blue: #4f6bff; --violet: #8b5cf6; --magenta: #d946ef;
    --grad: linear-gradient(120deg, var(--cyan), var(--blue) 40%, var(--violet) 70%, var(--magenta));
    --ok: #34d399; --warn: #fbbf24; --fail: #f43f5e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: auto;
    font: 13px -apple-system, "Segoe UI", system-ui, Ubuntu, sans-serif;
    display: flex; flex-direction: column; gap: 10px; padding: 14px 18px;
    position: relative;
  }
  /* Два розмиті відблиски, що повільно пливуть за вмістом */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; width: 420px; height: 420px; border-radius: 50%;
    filter: blur(90px); opacity: .35; pointer-events: none;
  }
  body::before { background: var(--blue); top: -160px; left: -140px; animation: drift 18s ease-in-out infinite alternate; }
  body::after { background: var(--magenta); bottom: -200px; right: -160px; opacity: .25; animation: drift 22s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(90px, 60px) scale(1.15); } }

  header, form, section:not(.logbox) { flex: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(12px); }

  /* Шапка */
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { position: relative; width: 48px; height: 48px; flex: none; }
  .logo img { position: relative; width: 48px; height: 48px; border-radius: 12px; display: block; }
  .logo::before {
    content: ""; position: absolute; inset: -3px; border-radius: 15px; opacity: 0;
    background: conic-gradient(from 0deg, var(--cyan), var(--blue), var(--violet), var(--magenta), var(--cyan));
    transition: opacity .3s;
  }
  body.busy .logo::before { opacity: 1; animation: spin 1.6s linear infinite; }
  .brand h1 {
    margin: 0; font-size: 20px; letter-spacing: .2px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .brand > div:not(.logo) { flex: 1; }
  .brand a {
    color: var(--text); font-size: 12px; text-decoration: none; white-space: nowrap;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; transition: border-color .2s, background .2s;
  }
  .brand a:hover { border-color: var(--border-strong); background: rgba(122, 112, 255, .12); }

  /* Форма */
  fieldset { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; transition: opacity .3s; }
  fieldset:disabled { opacity: .5; }
  label { text-align: right; color: var(--muted); }
  input[type=text], input[type=password] {
    width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--field); color: var(--text); font: inherit; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #4b5175; }
  input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 92, 246, .25); }
  .seg { position: relative; display: flex; background: var(--field); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .seg input { display: none; }
  .seg label { flex: 1; text-align: center; padding: 5px 6px; white-space: nowrap; font-size: 12px; border-radius: 6px; cursor: pointer; color: var(--muted); transition: color .2s, background .25s, box-shadow .25s; }
  .seg label:hover { color: var(--text); }
  .seg input:checked + label { background: var(--grad); color: #fff; box-shadow: 0 2px 12px rgba(91, 108, 255, .45); }
  .hidden { display: none !important; }
  .where { font-size: 11px; color: var(--muted); user-select: text; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; }

  /* Рядок дії */
  .action { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--field); color: var(--text); cursor: pointer; transition: border-color .2s, background .2s, transform .1s;
  }
  button:hover:not(:disabled) { border-color: var(--border-strong); background: #141a35; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary {
    border: 0; color: #fff; min-width: 150px; padding: 9px 18px; font-size: 14px; font-weight: 600;
    background: linear-gradient(120deg, var(--cyan), var(--blue), var(--violet), var(--magenta), var(--blue), var(--cyan));
    background-size: 300% 100%; box-shadow: 0 4px 20px rgba(91, 108, 255, .4); transition: box-shadow .2s, transform .1s, opacity .2s;
  }
  button.primary:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(139, 92, 246, .6); background: linear-gradient(120deg, var(--cyan), var(--blue), var(--violet), var(--magenta), var(--blue), var(--cyan)); background-size: 300% 100%; }
  body.busy button.primary { opacity: .85; animation: shimmer 2.4s linear infinite; }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .lamp { width: 18px; height: 18px; border-radius: 50%; background: #3b3f5c; box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); transition: background .3s, box-shadow .3s; }
  .lamp.working { background: var(--warn); box-shadow: 0 0 10px var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .lamp.ok { background: var(--ok); box-shadow: 0 0 14px var(--ok); animation: pop .5s ease-out; }
  .lamp.fail { background: var(--fail); box-shadow: 0 0 14px var(--fail); animation: shake .4s ease-out; }
  @keyframes pulse { 50% { box-shadow: 0 0 22px var(--warn); transform: scale(1.12); } }
  @keyframes pop { 40% { transform: scale(1.4); } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .state { font-weight: 600; font-size: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Блоки кроків */
  .steps { display: flex; flex: none; padding: 12px 6px 8px; }
  .step { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .step::before {
    content: ""; position: absolute; top: 14px; right: 50%; width: 100%; height: 2px; z-index: 0;
    background: #262c4a; transition: background .4s;
  }
  .step:first-child::before { display: none; }
  .step.done::before, .step.active::before, .step.fail::before { background: var(--grad); }
  .dot {
    position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--field); border: 2px solid #2b3150; color: var(--muted); font-size: 12px; font-weight: 700;
    transition: background .3s, border-color .3s, color .3s, box-shadow .3s, transform .3s;
  }
  .step span { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; transition: color .3s; }
  .step.active .dot { border-color: transparent; background: var(--grad) border-box; color: #fff; box-shadow: 0 0 0 0 rgba(139, 92, 246, .6); animation: ring 1.4s ease-out infinite; transform: scale(1.1); }
  .step.active .dot::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--cyan); border-right-color: var(--magenta); animation: spin .9s linear infinite;
  }
  .step.active span { color: var(--text); font-weight: 600; }
  .step.done .dot { background: var(--grad); border-color: transparent; color: #fff; animation: pop .4s ease-out; }
  .step.done span { color: var(--text); }
  .step.fail .dot { background: var(--fail); border-color: transparent; color: #fff; box-shadow: 0 0 14px rgba(244, 63, 94, .6); animation: shake .4s ease-out; }
  .step.fail span { color: var(--fail); font-weight: 600; }
  .step.skipped { opacity: .4; }
  .step.skipped .dot { border-style: dashed; }
  @keyframes ring { 70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }

  /* Ключ і журнал */
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .head h2 { flex: 1; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .mono {
    margin: 0; padding: 9px 10px; background: var(--field); border: 1px solid var(--border); border-radius: 8px;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    user-select: text; overflow: auto;
  }
  #pubkey { height: 48px; transition: border-color .4s, box-shadow .4s; }
  #pubkey.fresh { border-color: var(--violet); animation: glow 1.6s ease-out; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, .7); } 100% { box-shadow: 0 0 0 14px rgba(139, 92, 246, 0); } }
  .logbox { flex: 1 0 170px; display: flex; flex-direction: column; }
  #log { flex: 1 1 0; min-height: 0; }
  #log div { animation: in .25s ease-out; }
  #log .step-line { color: #9fb4ff; }
  #log .ok { color: var(--ok); }
  #log .warn { color: var(--warn); }
  #log .fail { color: var(--fail); }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  #log::-webkit-scrollbar, #pubkey::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb, #pubkey::-webkit-scrollbar-thumb { background: #2b3150; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header class="brand">
    <div class="logo"><img src="../icons/hicolor/128x128/apps/ssh-key-maker.png" alt=""></div>
    <div>
      <h1>SSH Key Maker</h1>
      <p>Створення SSH-ключів і налаштування входу на сервер</p>
    </div>
    <a href="#" id="repo">GitHub ↗</a>
  </header>

  <form id="form" class="panel">
    <fieldset id="fields">
      <label>Режим:</label>
      <div class="seg">
        <input type="radio" name="mode" id="m-files" value="files"><label for="m-files">Лише ключі (keys)</label>
        <input type="radio" name="mode" id="m-ssh" value="sshDir"><label for="m-ssh">Ключі в ~/.ssh</label>
        <input type="radio" name="mode" id="m-full" value="full" checked><label for="m-full">Повне налаштування</label>
      </div>

      <label for="name" id="name-label">Назва (Host у конфігу):</label>
      <input type="text" id="name" placeholder="erp" autofocus spellcheck="false">

      <label for="host" class="full">Хост:</label>
      <input type="text" id="host" class="full" placeholder="176.103.114.151" spellcheck="false">

      <label for="port" class="full">Порт:</label>
      <input type="text" id="port" class="full" value="22">

      <label for="user" class="full">Користувач:</label>
      <input type="text" id="user" class="full" placeholder="root" spellcheck="false">

      <label for="serverPassword" class="full">Пароль сервера:</label>
      <input type="password" id="serverPassword" class="full" placeholder="для заливання ключа">

      <label for="passphrase">Пароль ключа:</label>
      <input type="password" id="passphrase" placeholder="необов'язково">

      <label>Куди:</label>
      <div class="where" id="where"></div>
    </fieldset>

    <div class="action">
      <button type="submit" class="primary" id="go">Згенерувати</button>
      <div class="lamp" id="lamp"></div>
      <span class="state" id="state">Очікує</span>
    </div>
  </form>

  <div class="panel steps" id="steps"></div>

  <section class="panel">
    <div class="head">
      <h2>Публічний ключ</h2>
      <button id="reveal" disabled>Показати в теці</button>
      <button id="copy" disabled>Копіювати</button>
    </div>
    <pre class="mono" id="pubkey">—</pre>
  </section>

  <section class="panel logbox">
    <div class="head"><h2>Журнал</h2></div>
    <div class="mono" id="log"></div>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
